{{/* 記事の共有ボタン（プロジェクト側で追加）
     配置: 記事の上部（メタ情報の下）と下部（本文の直後）の2か所
     構成: X・はてブ・リンクコピーの3つ / 形: アイコンのみの丸ボタン
     引数: context = ページ, top = 上部用（区切り線なし）かどうか */}}
{{- $page := .context -}}
{{- $text := printf "%s | %s" $page.Title $page.Site.Title -}}
{{- $url := $page.Permalink -}}
<div class="{{ if .top }}mb-8 flex items-center gap-3{{ else }}border-border mb-8 mt-4 flex items-center gap-3 border-t{{ end }}"{{ if not .top }} style="padding-top: 1.5rem"{{ end }}>
  <span class="text-muted-foreground text-xs font-medium">シェア</span>
  <a aria-label="Xでシェア" href="https://twitter.com/intent/tweet?text={{ $text | urlquery }}&url={{ $url | urlquery }}" target="_blank" rel="noopener noreferrer" class="border-border text-muted-foreground hover:border-primary/20 hover:text-primary flex h-10 w-10 items-center justify-center rounded-full border transition-colors">
    <svg class="h-4 w-4" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.234 10.162 22.977 0h-2.072l-7.591 8.824L7.251 0H.258l9.168 13.343L.258 24H2.33l8.016-9.318L16.749 24h6.993zm-2.837 3.299-.929-1.329L3.076 1.56h3.182l5.965 8.532.929 1.329 7.754 11.09h-3.182z"/></svg>
  </a>
  <a aria-label="はてなブックマークに登録" href="https://b.hatena.ne.jp/add?mode=confirm&url={{ $url | urlquery }}&title={{ $text | urlquery }}" target="_blank" rel="noopener noreferrer" class="border-border text-muted-foreground hover:border-primary/20 hover:text-primary flex h-10 w-10 items-center justify-center rounded-full border transition-colors">
    <svg class="h-4 w-4" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.47 0C22.42 0 24 1.58 24 3.53v16.94c0 1.95-1.58 3.53-3.53 3.53H3.53C1.58 24 0 22.42 0 20.47V3.53C0 1.58 1.58 0 3.53 0h16.94zm-3.705 14.47c-.78 0-1.41.63-1.41 1.41s.63 1.414 1.41 1.414 1.41-.645 1.41-1.425-.63-1.41-1.41-1.41zM8.61 17.247c1.2 0 2.056-.042 2.58-.12.526-.084.976-.222 1.32-.412.45-.232.78-.564 1.02-.99s.36-.915.36-1.48c0-.78-.21-1.403-.63-1.87-.42-.48-.99-.734-1.74-.794.66-.18 1.156-.45 1.456-.81.315-.344.465-.824.465-1.424 0-.48-.103-.885-.3-1.26-.21-.36-.493-.645-.883-.87-.345-.195-.735-.315-1.215-.405-.464-.074-1.29-.12-2.474-.12H5.654v10.486H8.61zm.736-4.185c.705 0 1.185.088 1.44.262.27.18.39.495.39.93 0 .405-.135.69-.42.855-.27.18-.765.254-1.44.254H8.31v-2.297h1.05zm8.656.706v-7.06h-2.46v7.06H18zM8.925 9.08c.71 0 1.185.08 1.432.24.245.16.367.435.367.83 0 .38-.13.646-.39.804-.265.154-.747.232-1.452.232h-.57V9.08h.615z"/></svg>
  </a>
  <button type="button" aria-label="リンクをコピー" onclick="navigator.clipboard.writeText('{{ $url }}').then(() => { const s = this.closest('div').querySelector('[data-share-feedback]'); s.textContent = 'リンクをコピーしました'; setTimeout(() => { s.textContent = ''; }, 2400); })" class="border-border text-muted-foreground hover:border-primary/20 hover:text-primary flex h-10 w-10 cursor-pointer items-center justify-center rounded-full border transition-colors">
    {{ partial "features/icon.html" (dict "name" "link" "size" "sm") }}
  </button>
  <span data-share-feedback class="text-muted-foreground text-sm"></span>
</div>
